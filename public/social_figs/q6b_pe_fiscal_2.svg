<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 525" role="img" aria-label="② 日本の社会保障給付費の部門別割合" style="font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fafafa">
  <rect x="10" y="10" width="680" height="505" fill="#fafafa" stroke="#18181b" stroke-width="2.2"/>
  <text x="350" y="46" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">② 日本の社会保障給付費の部門別割合</text>
  <text x="350" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">高齢化に伴い「年金」と「医療」で全体の約75%を占める（近年は介護・福祉が拡大）</text>
  <line x1="165.0" y1="438" x2="165.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="165.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">0%</text>
  <line x1="245.0" y1="98" x2="245.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="245.0" y1="438" x2="245.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="245.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">10%</text>
  <line x1="325.0" y1="98" x2="325.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="325.0" y1="438" x2="325.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="325.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">20%</text>
  <line x1="405.0" y1="98" x2="405.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="405.0" y1="438" x2="405.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="405.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">30%</text>
  <line x1="485.0" y1="98" x2="485.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="485.0" y1="438" x2="485.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="485.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">40%</text>
  <line x1="565.0" y1="98" x2="565.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="565.0" y1="438" x2="565.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="565.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">50%</text>
  <line x1="645.0" y1="98" x2="645.0" y2="438" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
  <line x1="645.0" y1="438" x2="645.0" y2="444" stroke="#18181b" stroke-width="1.6"/>
  <text x="645.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">60%</text>
  <line x1="165" y1="98" x2="165" y2="438" stroke="#18181b" stroke-width="1.8"/>
  <line x1="165" y1="438" x2="645" y2="438" stroke="#18181b" stroke-width="1.8"/>
  <text x="405.0" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">社会保障給付費に占める割合（％）</text>
  <rect x="165" y="130.7" width="352.0" height="48.0" fill="#334155" stroke="#18181b" stroke-width="1.6"/>
  <text x="153" y="160.7" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">年金</text>
  <text x="527.0" y="160.7" text-anchor="start" font-size="16" font-weight="800" fill="#0f172a">44%</text>
  <rect x="165" y="244.0" width="256.0" height="48.0" fill="#64748b" stroke="#18181b" stroke-width="1.6"/>
  <text x="153" y="274.0" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">医療</text>
  <text x="431.0" y="274.0" text-anchor="start" font-size="16" font-weight="800" fill="#0f172a">32%</text>
  <rect x="165" y="357.3" width="192.0" height="48.0" fill="#cbd5e1" stroke="#18181b" stroke-width="1.6"/>
  <text x="153" y="387.3" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">福祉その他
(介護・子育て)</text>
  <text x="367.0" y="387.3" text-anchor="start" font-size="16" font-weight="800" fill="#0f172a">24%</text>
