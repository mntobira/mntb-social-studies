<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 525" role="img" aria-label="① 等高線の『尾根線』と『谷線』・2万5千分の1縮尺の鉄則" style="font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fafafa">
  <rect x="10" y="10" width="680" height="505" fill="#fafafa" stroke="#18181b" stroke-width="2.2"/>
  <text x="350" y="44" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">① 等高線の「尾根線」と「谷線」・集水域判読</text>
  <text x="350" y="70" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">（2万5千分の1地形図：主曲線＝10m間隔・計曲線＝50m間隔・地図4cm＝実距離1km）</text>
  <!-- Left box: Ridge -->
  <rect x="36" y="96" width="300" height="310" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="186" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">尾根（分水界・見通し◎）</text>
  <circle cx="186" cy="162" r="5" fill="#0f172a"/>
  <text x="186" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">▲ 山頂 320m</text>
  <path d="M 86 200 Q 186 255 286 200" fill="none" stroke="#475569" stroke-width="2.5"/>
  <text x="292" y="202" font-size="12" font-weight="800" fill="#334155">300m</text>
  <path d="M 72 250 Q 186 320 300 250" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <text x="304" y="254" font-size="12" font-weight="700" fill="#475569">250m</text>
  <path d="M 60 300 Q 186 382 312 300" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <text x="314" y="306" font-size="12" font-weight="700" fill="#475569">200m</text>
  <line x1="186" y1="170" x2="186" y2="365" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="186" y="392" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b91c1c">低い方へ「張り出す」＝尾根線！</text>
  <!-- Right box: Valley -->
  <rect x="364" y="96" width="300" height="310" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="514" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">谷（河川流路・土石流注意）</text>
  <text x="514" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">▲ 山頂側（標高高い側）</text>
  <path d="M 410 225 Q 514 160 618 225" fill="none" stroke="#475569" stroke-width="2.5"/>
  <text x="622" y="228" font-size="12" font-weight="800" fill="#334155">300m</text>
  <path d="M 402 285 Q 514 212 626 285" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <text x="628" y="288" font-size="12" font-weight="700" fill="#475569">250m</text>
  <path d="M 394 345 Q 514 266 634 345" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <text x="636" y="348" font-size="12" font-weight="700" fill="#475569">200m</text>
  <line x1="514" y1="186" x2="514" y2="365" stroke="#0369a1" stroke-width="3.2"/>
  <polygon points="514,372 507,358 521,358" fill="#0369a1"/>
  <text x="514" y="392" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0369a1">高い方へ「食い込む」＝谷線（川）！</text>
  <!-- Bottom formula bar -->
  <rect x="36" y="420" width="628" height="78" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  <text x="350" y="448" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">★ 縮尺＆勾配の1秒公式：2万5千分の1（1cm＝250m・4cm＝1km）⇔ 5万分の1（1cm＝500m・2cm＝1km）</text>
  <text x="350" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">平均勾配（%）＝ 標高差（m）÷ 水平実距離（m）× 100　※凸型斜面は途中が膨らみ麓が見えない（死角）！</text>
</svg>
